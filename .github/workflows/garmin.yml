name: Garmin daily pull

on:
  schedule:
    # Target: fresh data by about 08:00 in Adelaide. GitHub's clock is UTC, Adelaide moves with
    # daylight saving, and GitHub often starts scheduled jobs hours late (the first two real runs
    # were about 3.5 hours late). So ask several times from early morning; each run is a cheap
    # repeat of the last, and minute 17 avoids the top-of-the-hour queue.
    - cron: '17 18 * * *'
    - cron: '17 19 * * *'
    - cron: '17 20 * * *'
    - cron: '17 21 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to pull (3 for a normal run, 365 for the first load)'
        default: '3'

permissions:
  contents: read

concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet garminconnect==0.3.17 requests
      - run: python garmin/sync.py
        env:
          SUPABASE_URL: https://cycpaeykmufxxkhmrvdf.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          DAYS: ${{ inputs.days || '3' }}
