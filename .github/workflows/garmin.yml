name: Garmin daily pull

on:
  schedule:
    # About 08:00 in Adelaide. GitHub's clock is UTC and Adelaide moves with daylight saving,
    # so run at 21:35 and 22:35 UTC; the second run is a cheap repeat.
    - cron: '35 21 * * *'
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to pull (3 for a normal run, 365 for the first load)'
        default: '3'

permissions:
  contents: read

concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet garminconnect==0.3.17 requests
      - run: python garmin/sync.py
        env:
          SUPABASE_URL: https://cycpaeykmufxxkhmrvdf.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          DAYS: ${{ inputs.days || '3' }}
